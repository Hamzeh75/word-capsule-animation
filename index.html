<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f8">
<title>Word &amp; Capsule Animation</title>
<meta name="description" content="Type a word, add photos, and export a smooth capsule-reveal GIF — English, Persian, Arabic, Chinese and Hindi.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- link previews (WhatsApp, Telegram, X, LinkedIn, Slack, iMessage…) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Word &amp; Capsule Animation">
<meta property="og:title" content="Word &amp; Capsule Animation">
<meta property="og:description" content="Type a word, add your photos, and download a looping GIF where a capsule opens inside the word. English, Persian, Arabic, Chinese and Hindi.">
<meta property="og:url" content="https://word-capsule-animation.vercel.app/">
<meta property="og:image" content="https://word-capsule-animation.vercel.app/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Persian word ایران with a capsule opening in the middle, showing the stained-glass windows of a mosque">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Word &amp; Capsule Animation">
<meta name="twitter:description" content="Type a word, add your photos, and download a looping GIF where a capsule opens inside the word.">
<meta name="twitter:image" content="https://word-capsule-animation.vercel.app/og-image.jpg">
<meta name="twitter:image:alt" content="The Persian word ایران with a capsule opening in the middle, showing the stained-glass windows of a mosque">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Vazirmatn:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
<aside class="panel" id="panel" dir="ltr">
  <div class="sheet-handle" id="sheetHandle" role="button" tabindex="0" data-title-t="sheetHandle"><span></span></div>
  <div class="head">
    <div class="head-text">
      <div class="brand" data-t="brand"></div>
      <div class="sub" data-t="sub"></div>
    </div>
    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn" aria-haspopup="listbox" data-title-t="language">
        <span class="flag" id="langFlag"></span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="lang-menu" role="listbox">
        <button class="lang-item" data-lang="en"><span class="flag"></span><span class="ln">English</span><small>English</small></button>
        <button class="lang-item" data-lang="fa"><span class="flag"></span><span class="ln">Persian</span><small>فارسی</small></button>
        <button class="lang-item" data-lang="ar"><span class="flag"></span><span class="ln">Arabic</span><small>العربية</small></button>
        <button class="lang-item" data-lang="zh"><span class="flag"></span><span class="ln">Chinese</span><small>中文</small></button>
        <button class="lang-item" data-lang="hi"><span class="flag"></span><span class="ln">Hindi</span><small>हिन्दी</small></button>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="label"><span data-t="text"></span><span class="req" aria-hidden="true">*</span></div>
    <input class="control" id="text" type="text" value="USA" maxlength="24" dir="auto">
    <div class="hint" data-t="textHint"></div>
  </div>

  <div class="field">
    <div class="label"><span data-t="splitAt"></span> <span class="help" data-tip-t="splitAtTip">?</span></div>
    <select class="control" id="splitAt"></select>
  </div>

  <div class="field" id="kashidaField">
    <div class="label"><span data-t="kashida"></span> <span class="help" data-tip-t="kashidaTip">?</span></div>
    <select class="control" id="kashida" data-opts="kashidaOpts" data-default="2"></select>
  </div>

  <div class="field">
    <div class="label"><span data-t="ratio"></span> <span class="help" data-tip-t="ratioTip">?</span></div>
    <select class="control" id="ratio" data-opts="ratioOpts" data-default="1:1"></select>
  </div>

  <div class="field">
    <div class="label"><span data-t="photos"></span> <span class="help" data-tip-t="photosTip">?</span></div>
    <div class="seg">
      <button id="useDefault" class="on" data-t="defaultPhotos"></button>
      <button id="useMine" data-t="myPhotos"></button>
    </div>
    <label class="upload photo-upload" id="photoUpload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0-4 4m4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span data-t="uploadPhotos"></span>
      <input type="file" id="imgfile" accept="image/*" multiple>
    </label>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="field">
    <div class="label"><span data-t="font"></span> <span class="help" data-tip-t="fontTip">?</span></div>
    <label class="upload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0-4 4m4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span id="fontLabel" data-t="uploadFont"></span>
      <input type="file" id="fontfile" accept=".ttf,.otf,.woff,.woff2">
    </label>
  </div>

  <div class="field">
    <div class="label"><span data-t="weight"></span> <span class="help" data-tip-t="weightTip">?</span></div>
    <select class="control" id="weight" data-opts="weightOpts" data-default="900"></select>
  </div>

  <div class="field">
    <div class="label"><span data-t="bg"></span> <span class="help" data-tip-t="bgTip">?</span></div>
    <select class="control" id="bg" data-opts="bgOpts" data-default="grain"></select>
    <label class="upload bgUpload" id="bgUpload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0-4 4m4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span id="bgLabel" data-t="uploadBg"></span>
      <input type="file" id="bgfile" accept="image/*">
    </label>
  </div>

  <div class="field">
    <div class="label"><span data-t="speed"></span> <span class="help" data-tip-t="speedTip">?</span><span class="speed-val" id="speedVal">1×</span></div>
    <div class="speed-row">
      <span class="speed-end" data-t="slow"></span>
      <input type="range" class="speed" id="speed" min="0" max="6" step="1" value="2" dir="ltr">
      <span class="speed-end" data-t="fast"></span>
    </div>
  </div>

  <div class="field">
    <div class="label"><span data-t="playback"></span> <span class="help" data-tip-t="playbackTip">?</span></div>
    <div class="seg" role="radiogroup">
      <button id="loopOn" class="on" role="radio" data-t="loopOn"></button>
      <button id="loopOff" role="radio" data-t="loopOff"></button>
    </div>
    <button class="replay-btn" id="replay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span data-t="replay"></span>
    </button>
  </div>

  <div class="field">
    <div class="label"><span data-t="preset"></span> <span class="help" data-tip-t="presetTip">?</span></div>
    <select class="control" id="preset" data-opts="presetOpts" data-default="custom"></select>
  </div>

  <div class="field row gif-manual">
    <div>
      <div class="label"><span data-t="gifSize"></span> <span class="help" data-tip-t="gifSizeTip">?</span></div>
      <select class="control" id="gifSize" data-opts="sizeOpts" data-default="1080"></select>
    </div>
    <div>
      <div class="label"><span data-t="fps"></span> <span class="help" data-tip-t="fpsTip">?</span></div>
      <select class="control" id="gifFps" data-opts="fpsOpts" data-default="50"></select>
    </div>
  </div>

  <div class="field gif-manual">
    <div class="label"><span data-t="gifCount"></span> <span class="help" data-tip-t="gifCountTip">?</span></div>
    <select class="control" id="gifCount" data-opts="countOpts" data-default="all"></select>
  </div>
  <div class="estimate" id="estimate" aria-live="polite"></div>

  <div class="genbar">
    <button class="generate" id="generate">
      <div class="bar" id="bar"></div>
      <svg class="gico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="3.5" width="15" height="13" rx="3"/>
        <circle cx="7.5" cy="8" r="1.4" fill="#fff" stroke="none"/>
        <path d="m3.5 14.5 4-4 3 3 2-2 4 4"/>
        <g class="arrow"><circle cx="18" cy="17" r="4.6" fill="#fff" stroke="none"/><path d="M18 14.6v4.6m-2-2 2 2 2-2" stroke="#141414" stroke-width="1.7"/></g>
      </svg>
      <span id="genLabel" data-t="create"></span>
    </button>
    <button class="reset" id="reset" data-title-t="reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span data-t="reset"></span>
    </button>
    <div class="status" id="status"></div>
  </div>
  <div class="gif-box">
    <div class="label"><span data-t="gifPreviewTitle"></span></div>
    <div class="gif-slot" id="gifSlot">
      <img class="preview-gif" id="gifPreview" alt="GIF">
      <div class="gif-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m4 18 5-5 3.5 3.5L15 14l5 5"/></svg>
        <span data-t="gifPreviewEmpty"></span>
      </div>
    </div>
  </div>

  <footer class="credit">
    <span><span data-t="poweredBy"></span> <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a></span>
    <span class="dot">·</span>
    <a class="gh" href="https://github.com/Hamzeh75" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg><span>Hamzeh75</span></a>
    <span class="dot stars-dot" hidden>·</span>
    <a class="stars" id="stars" href="https://github.com/Hamzeh75/word-capsule-animation/stargazers" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>
      <span id="starCount"></span>
    </a>
    <a class="site" href="https://hamzeh.framer.ai" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5s1.3-6.8 3.9-9.5Z"/></svg><span>hamzeh.framer.ai</span></a>
  </footer>
</aside>

<!-- shown once, after the first GIF is saved -->
<div class="star-pop" id="starPop" role="dialog" aria-modal="true" aria-labelledby="starTitle" hidden>
  <div class="star-card">
    <button class="star-x" id="starClose" data-title-t="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="star-icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg></div>
    <h3 id="starTitle" data-t="starTitle"></h3>
    <p data-t="starText"></p>
    <a class="star-go" id="starGo" href="https://github.com/Hamzeh75/word-capsule-animation" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>
      <span data-t="starGo"></span>
    </a>
    <button class="star-later" id="starLater" data-t="starLater"></button>
  </div>
</div>

<main class="stage" id="stage">
  <div class="frame" id="frame"><canvas id="view"></canvas></div>
  <div class="tl" id="tl">
    <button class="tl-play" id="tlPlay" aria-label="play/pause">
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
    </button>
    <div class="tl-track">
      <div class="tl-marks" id="tlMarks"></div>
      <input type="range" id="tlRange" min="0" max="1000" step="1" value="0" aria-label="timeline">
    </div>
    <div class="tl-time" id="tlTime">0:00 / 0:00</div>
    <button class="tl-speed" id="tlSpeed" title="speed">1×</button>
  </div>
</main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
